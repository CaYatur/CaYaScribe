[project]
name = "cayascribe-sidecar"
version = "0.1.4"
description = "Local FastAPI sidecar for CaYaScribe"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CaYaScribe maintainers" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "faster-whisper>=1.1.0",
  "huggingface-hub>=0.26",
  "onnxruntime>=1.20",
  "sherpa-onnx>=1.10",
  "numpy>=2.0",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cayascribe*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["S110", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
